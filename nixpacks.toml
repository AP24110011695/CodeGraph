[phases.setup]
nixPkgs = ["python312"]

[phases.build]
cmds = [
  "cd backend",
  "python -m venv .venv",
  ".venv/bin/pip install --upgrade pip",
  ".venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "cd backend && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[variables]
APP_ENV = "production"
FRONTEND_URL = "https://code-graph-alpha.vercel.app"